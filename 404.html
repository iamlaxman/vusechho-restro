<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | THE भु-से-छो:</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1a1612" />
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a1612;color:#f4efe8;font-family:'Archivo',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .error-container{max-width:600px}
    .error-code{font-family:'Archivo Black',sans-serif;font-size:clamp(4rem,15vw,8rem);color:#e8702a;line-height:1}
    .error-title{font-family:'Mukta',sans-serif;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:800;margin:1rem 0}
    .error-text{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#8a8177;margin-bottom:2rem}
    .error-btn{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.8rem 1.5rem;background:#e8702a;color:#fff;border-radius:4px;text-decoration:none;transition:all .3s}
    .error-btn:hover{background:#c84c2c;transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">पृष्ठ भेटिएन</h1>
    <p class="error-text">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="error-btn">BACK TO HOME ↗</a>
  </div>
</body>
</html>
